global
    log stdout format raw local0

defaults
    log     global
    mode    tcp
    timeout connect 5s
    timeout client  50s
    timeout server  50s

frontend victory_ingress
    bind 0.0.0.0:9000
    default_backend victory_nodes

backend victory_nodes
    mode tcp
    balance leastconn
    server node1 victory1:9000 check inter 2s fall 2 rise 2
    server node2 victory2:9000 check inter 2s fall 2 rise 2
