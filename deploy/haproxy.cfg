global
    log stdout format raw local0
    maxconn 20000
    master-worker
    hard-stop-after 10s

defaults
    log global
    mode tcp
    option tcplog
    option dontlognull
    option tcpka
    option redispatch
    retries 2
    timeout connect 2s
    timeout check 2s
    timeout queue 5s
    # Above Victory's maximum idle deadline: 3 * 60 seconds.
    timeout client 240s
    timeout server 240s
    timeout tunnel 240s
    timeout client-fin 10s
    timeout server-fin 10s

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 3s
    hold refused 3s
    hold timeout 3s
    hold other 3s

frontend victory_ingress
    bind :9000
    mode tcp
    default_backend victory_nodes

backend victory_nodes
    mode tcp
    balance leastconn
    option tcp-check
    tcp-check connect
    # A pre-HELLO PING must reach the application and return an ERROR frame.
    tcp-check send-binary ce570105000000000001000000080102030405060708
    tcp-check expect binary ce5701080000
    default-server inter 2s fastinter 1s downinter 5s fall 3 rise 2
    # Existing sessions continue draining when a listener fails its check.
    server victory1 victory1:9000 check maxconn 10000 resolvers docker resolve-prefer ipv4 init-addr none
    server victory2 victory2:9000 check maxconn 10000 resolvers docker resolve-prefer ipv4 init-addr none