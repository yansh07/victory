name: victory

x-victory-environment: &victory-environment
  PYTHONPATH: /app/src
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

x-victory-node: &victory-node
  image: python:3.11-slim
  working_dir: /app
  env_file:
    - ../.env
  restart: unless-stopped
  depends_on:
    - redis
  entrypoint:
    - python
    - -c
    - |
      import os
      import sys
      os.makedirs("/var/lib/victory/wal", mode=0o700, exist_ok=True)
      os.execv(sys.executable, [
          sys.executable, "-m", "victory.server",
          "--node-id", os.environ["VICTORY_NODE_ID"],
          "--host", "0.0.0.0", "--port", "9000",
          "--redis-host", "redis", "--redis-port", "6379",
          "--wal-dir", "/var/lib/victory/wal",
          "--max-connections", "10000", "--shutdown-ms", "5000",
      ])
  command: []
  networks: [victory]

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --bind
      - 0.0.0.0
      - --protected-mode
      - "no"
      - --save
      - ""
      - --appendonly
      - "no"
    networks: [victory]

  victory1:
    <<: *victory-node
    environment:
      <<: *victory-environment
      VICTORY_NODE_ID: "1"
    volumes:
      - ../:/app:ro
      - victory1_wal:/var/lib/victory
    ports:
      - "127.0.0.1:9001:9000"

  victory2:
    <<: *victory-node
    environment:
      <<: *victory-environment
      VICTORY_NODE_ID: "2"
    volumes:
      - ../:/app:ro
      - victory2_wal:/var/lib/victory
    ports:
      - "127.0.0.1:9002:9000"

  haproxy:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    ports:
      - "${VICTORY_BIND_HOST:-127.0.0.1}:${VICTORY_PORT:-9000}:9000"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - victory1
      - victory2
    networks: [victory]

networks:
  victory:
    driver: bridge

volumes:
  victory1_wal:
  victory2_wal: